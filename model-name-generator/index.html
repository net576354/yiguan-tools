<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>型號及品名產生器</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --border:#dfe3e8; --text:#1f2430;
    --muted:#6b7280; --accent:#2f6fed; --accent-dark:#1f4fb0; --danger:#e0473c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--text);
  }
  header{
    background:var(--accent); color:#fff; padding:20px 28px;
  }
  header h1{margin:0; font-size:20px;}
  header p{margin:4px 0 0; font-size:13px; opacity:.85;}
  .container{max-width:1100px; margin:24px auto; padding:0 20px 60px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:20px; margin-bottom:20px;
  }
  .card h2{margin:0 0 14px; font-size:16px;}
  .fields-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:13px; font-weight:600; color:var(--muted);}
  .field-row{display:flex; gap:6px;}
  select{
    flex:1; padding:8px 8px; border:1px solid var(--border); border-radius:6px;
    font-size:14px; background:#fff; color:var(--text);
  }
  .icon-btn{
    border:1px solid var(--border); background:#fff; border-radius:6px;
    width:34px; cursor:pointer; font-size:16px; color:var(--accent);
  }
  .icon-btn:hover{background:#eef3ff;}
  .result{
    display:flex; flex-wrap:wrap; gap:30px; margin-top:6px;
  }
  .result .item{flex:1; min-width:260px;}
  .result .item .label{font-size:12px; color:var(--muted); margin-bottom:4px;}
  .result .item .value{
    font-size:20px; font-weight:700; word-break:break-all;
    background:#f0f4ff; border:1px dashed var(--accent); border-radius:8px;
    padding:10px 14px; min-height:24px;
  }
  .copy-btn{
    margin-top:8px; font-size:12px; border:none; background:none; color:var(--accent);
    cursor:pointer; padding:0;
  }
  .manage-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .tab-btn{
    border:1px solid var(--border); background:#fff; border-radius:16px; padding:6px 14px;
    font-size:13px; cursor:pointer; color:var(--text);
  }
  .tab-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{border-bottom:1px solid var(--border); padding:8px 6px; text-align:left;}
  th{color:var(--muted); font-weight:600;}
  td.actions{white-space:nowrap; width:90px;}
  .btn{
    border:none; border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-danger{background:#fff; color:var(--danger); border:1px solid var(--danger);}
  .btn-danger:hover{background:#fdeceb;}
  .btn-ghost{background:none; color:var(--accent); border:1px solid var(--accent);}
  .add-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .add-row input{
    padding:7px 9px; border:1px solid var(--border); border-radius:6px; font-size:13px;
  }
  .add-row input.code{width:120px;}
  .add-row input.name{flex:1; min-width:160px;}
  .hint{font-size:12px; color:var(--muted); margin-top:6px;}
  .error{color:var(--danger); font-size:12px; margin-top:6px; min-height:14px;}
  .empty-flag{font-size:11px; color:var(--muted);}
  .toolbar-right{display:flex; gap:8px; margin-bottom:10px; justify-content:flex-end;}
</style>
</head>
<body>

<header>
  <h1>型號及品名產生器</h1>
  <p>依下方欄位下拉選擇，自動組合成「型號」與「品名」。可在下方「欄位管理」新增類別內容。</p>
</header>

<div class="container">

  <div class="card">
    <h2>產生型號 / 品名</h2>
    <div class="fields-grid" id="fieldsGrid"></div>

    <div class="field special-paint-field" style="margin-top:14px;">
      <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
        <input type="checkbox" id="specialPaintEnable" onchange="toggleSpecialPaint()">
        特殊烤漆厚度（有需要時勾選）
      </label>
      <div id="specialPaintInputs" style="display:none; margin-top:8px;">
        <select id="select_backPaintSystem" onchange="updateOutput()" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; margin-bottom:8px;">
          <option value="">（不選用）背面漆種</option>
        </select>
        <div class="field-row">
          <input type="text" inputmode="decimal" id="specialPaintFront" placeholder="正面厚度 (um)" oninput="sanitizeThicknessInput(this); updateOutput()" style="flex:1; padding:8px; border:1px solid var(--border); border-radius:6px;">
          <input type="text" inputmode="decimal" id="specialPaintBack" placeholder="反面厚度 (um)" oninput="sanitizeThicknessInput(this); updateOutput()" style="flex:1; padding:8px; border:1px solid var(--border); border-radius:6px;">
        </div>
      </div>
    </div>

    <div class="result">
      <div class="item">
        <div class="label">型號（由欄位代碼組成）</div>
        <div class="value" id="modelOutput">－</div>
        <button class="copy-btn" onclick="copyText('modelOutput')">複製型號</button>
      </div>
      <div class="item">
        <div class="label">品名（由欄位名稱組成）</div>
        <div class="value" id="nameOutput">－</div>
        <button class="copy-btn" onclick="copyText('nameOutput')">複製品名</button>
      </div>
      <div class="item">
        <div class="label">銷貨品名（厚度銷貨品名 + 顏色）</div>
        <div class="value" id="salesNameOutput">－</div>
        <button class="copy-btn" onclick="copyText('salesNameOutput')">複製銷貨品名</button>
      </div>
    </div>

    <div style="margin-top:14px;">
      <button class="btn btn-primary" id="addToListBtn" onclick="addCurrentToList()" disabled>+ 加入下方產品種類清單</button>
    </div>
  </div>

  <div class="card">
    <h2>產品種類清單</h2>
    <div class="toolbar-right">
      <button class="btn btn-ghost" onclick="exportProductListToExcel()">匯出為 Excel</button>
      <button class="btn btn-danger" onclick="clearProductList()">清空清單</button>
    </div>
    <table>
      <thead>
        <tr><th style="width:28%;">型號</th><th>品名</th><th>銷貨品名</th><th class="actions">操作</th></tr>
      </thead>
      <tbody id="productListBody"></tbody>
    </table>
    <div class="hint">每一列的型號／品名皆可直接點擊修改；清單會自動儲存在本機瀏覽器。</div>
  </div>

  <div class="card">
    <h2>欄位管理（新增 / 編輯 / 刪除 類別內容）</h2>
    <div class="manage-tabs" id="manageTabs"></div>
    <div id="manageBody"></div>
  </div>

  <div class="card">
    <h2>資料備份</h2>
    <div class="toolbar-right">
      <button class="btn btn-ghost" onclick="exportData()">匯出設定 (JSON)</button>
      <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">匯入設定 (JSON)</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn btn-danger" onclick="resetData()">還原預設值</button>
    </div>
    <div class="hint">設定會自動儲存在本機瀏覽器（localStorage）。更換瀏覽器或清除快取前，建議先匯出備份。</div>
  </div>

</div>

<script>
const STORAGE_KEY = "modelNameGenerator.v1";

// -------- 欄位定義 --------
// order = 組成型號/品名時的順序；required = 是否必填(會影響是否允許留空)
const FIELD_DEFS = [
  { key: "category",      label: "類別",     required: true  },
  { key: "material",      label: "材質",     required: true  },
  { key: "coating",       label: "鍍層",     required: true  },
  { key: "width",         label: "入料寬度", required: true  },
  { key: "thickness",     label: "厚度",     required: true  },
  { key: "brand",         label: "廠別",     required: true  },
  { key: "paintSystem",   label: "漆種",     required: true  },
  { key: "color",         label: "顏色",     required: true  },
  { key: "strength",      label: "強度",     required: true  },
];

// -------- 預設資料（可自行調整/新增） --------
// 注意：required 欄位若無「不選用」選項，畫面預設會選到清單第一筆，
// 因此「烤漆系統」將 PE 排在第一筆，作為預設值。
const DEFAULT_DATA = {
  category: [
    {code:"C", name:"鋼捲"}, {code:"A", name:"鋁捲"},
    {code:"CR1", name:"單面樹脂鋼捲"}, {code:"CR2", name:"雙面樹脂鋼捲"}, {code:"CP", name:"印刷鋼捲"},
  ],
  material: [
    {code:"S", name:"鋼"}, {code:"AL", name:"鋁"},
    {code:"ALZN", name:"鋁鋅"}, {code:"MG", name:"鎂合金"},
  ],
  coating: [
    {code:"GI", name:"鍍鋅"}, {code:"GL", name:"鍍鋁鋅"},
    {code:"AZ150", name:"AZ150"}, {code:"AZ200", name:"AZ200"}, {code:"ZM300", name:"ZM300"},
  ],
  width: [
    {code:"W1000", name:"寬度1000mm"}, {code:"W1219", name:"寬度1219mm"},
    {code:"W4C", name:"寬度4尺"}, {code:"W914", name:"寬度914mm"}, {code:"W370", name:"寬度370mm"},
    {code:"W830", name:"寬度830mm"}, {code:"W850", name:"寬度850mm"}, {code:"W890", name:"寬度890mm"},
  ],
  thickness: [
    {code:"T03", name:"厚度0.3mm"}, {code:"T04", name:"厚度0.4mm"},
    {code:"T042", name:"厚度0.42mm"}, {code:"T052", name:"厚度0.52mm"}, {code:"T0176", name:"厚度0.176mm"},
    {code:"T017", name:"厚度0.17mm"}, {code:"T018", name:"厚度0.18mm"}, {code:"T0324", name:"厚度0.324mm"},
    {code:"T0376", name:"厚度0.376mm"}, {code:"T041", name:"厚度0.41mm"}, {code:"T038", name:"厚度0.38mm"},
    {code:"T0476", name:"厚度0.476mm"}, {code:"T0526", name:"厚度0.526mm"}, {code:"T048", name:"厚度0.48mm"},
    {code:"T055", name:"厚度0.55mm"}, {code:"T0568", name:"厚度0.568mm"}, {code:"T0576", name:"厚度0.576mm"},
    {code:"T075", name:"厚度0.75mm"}, {code:"T035", name:"厚度0.35mm"}, {code:"T05", name:"厚度0.5mm"},
  ],
  brand: [
    {code:"CSC", name:"中鋼"}, {code:"YUS", name:"日新"},
    {code:"YEH", name:"燁輝"}, {code:"SY", name:"盛餘"}, {code:"YT", name:"裕鐵"},
  ],
  paintSystem: [
    {code:"PE", name:"PE烤漆"}, {code:"PU", name:"PU烤漆"}, {code:"PVDF", name:"PVDF烤漆"},
    {code:"SMP", name:"SMP烤漆"},
  ],
  color: [
    {code:"WH", name:"白色"}, {code:"GR", name:"灰色"},
    {code:"COL001", name:"消光灰"}, {code:"COL002", name:"消光咖啡"}, {code:"COL003", name:"水晶藍"},
    {code:"COL004", name:"翡翠綠"}, {code:"COL005", name:"鐘乳白"}, {code:"COL006", name:"岩石灰"},
    {code:"COL007", name:"石榴紅"}, {code:"COL008", name:"白金銀"}, {code:"COL009", name:"珊瑚紅"},
    {code:"COL010", name:"琥珀黃"}, {code:"COL011", name:"珍珠白"}, {code:"COL012", name:"青銅綠"},
    {code:"COL013", name:"金剛黑"}, {code:"COL014", name:"消光淺灰"}, {code:"COL015", name:"消光銀色"},
    {code:"COL016", name:"消光香魚黃"}, {code:"COL017", name:"消光古典綠"}, {code:"COL018", name:"消光紅"},
    {code:"COL019", name:"玄鐵黑"}, {code:"COL020", name:"消光深茶"}, {code:"COL021", name:"消光白"},
    {code:"COL022", name:"鍍果"}, {code:"COL023", name:"鍍灰"}, {code:"COL024", name:"淺灰19HR"},
    {code:"COL025", name:"鍍紅"}, {code:"COL026", name:"鍍牙白"}, {code:"COL027", name:"鍍白"},
    {code:"COL028", name:"鍍米黃"}, {code:"COL029", name:"砂岩白"}, {code:"COL030", name:"愛馬仕橘"},
    {code:"COL031", name:"銀色"}, {code:"COL032", name:"古典綠"}, {code:"COL033", name:"消光玄鐵黑"},
    {code:"COL034", name:"墨綠"}, {code:"COL035", name:"果綠"}, {code:"COL036", name:"鋁紅"},
    {code:"COL037", name:"灰色(樹脂系列)"}, {code:"COL038", name:"牙白"}, {code:"COL039", name:"白(5用)"},
    {code:"COL040", name:"鈦白"}, {code:"COL041", name:"白(下層)"}, {code:"COL042", name:"鋁白(下層)"},
    {code:"COL043", name:"鋁白(830底板)"}, {code:"COL044", name:"鋁白"}, {code:"COL045", name:"鋁藍"},
    {code:"COL046", name:"鋁翠"}, {code:"COL047", name:"鋁灰"}, {code:"COL048", name:"鋁牙白"},
    {code:"COL049", name:"鋁米黃"}, {code:"COL050", name:"璞白"}, {code:"COL051", name:"29PJ淺灰"},
    {code:"COL052", name:"玄鐵黑19WQ"}, {code:"COL053", name:"岩灰"}, {code:"COL054", name:"冠鳩白"},
    {code:"COL055", name:"消光灰2CBL"}, {code:"COL056", name:"璞白色2WFN"}, {code:"COL057", name:"象牙色SC306"},
    {code:"COL058", name:"霧綠"}, {code:"COL059", name:"澄藍"}, {code:"COL060", name:"栗褐"},
    {code:"COL061", name:"鋅白"}, {code:"COL062", name:"梅花白"}, {code:"COL063", name:"岩灰901"},
    {code:"COL064", name:"美灰19QU"}, {code:"COL065", name:"銀色FV156"}, {code:"COL066", name:"骨白色FW266"},
    {code:"COL067", name:"白色FW286"}, {code:"COL068", name:"岩灰FY326"}, {code:"COL069", name:"樸白FW350"},
    {code:"COL070", name:"樸白FW386"}, {code:"COL071", name:"海藍FL507"}, {code:"COL072", name:"灰色FY628"},
    {code:"COL073", name:"消光灰FY836"}, {code:"COL074", name:"蒼藍"}, {code:"COL075", name:"乳白"},
    {code:"COL076", name:"消光灰SY926"}, {code:"COL077", name:"海藍SL656"}, {code:"COL078", name:"栗褐SB256"},
    {code:"COL079", name:"海鷗灰SY416"}, {code:"COL080", name:"樸白"}, {code:"COL081", name:"黑灰39XD"},
    {code:"COL082", name:"銀色2S04"}, {code:"COL084", name:"紅豆杉"}, {code:"COL085", name:"松木紋"},
    {code:"COL086", name:"淺柚木"}, {code:"COL087", name:"大理石白"}, {code:"COL088", name:"砂岩石"},
    {code:"COL089", name:"陶岩石"}, {code:"COL090", name:"髮絲灰"}, {code:"COL091", name:"髮絲白"},
  ],
  strength: [ {code:"HS", name:"高強度"}, {code:"NS", name:"普通強度"} ],
};

let data = loadData();
let activeTab = FIELD_DEFS[0].key;

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return structuredClone(DEFAULT_DATA);
    const parsed = JSON.parse(raw);
    // 確保所有欄位都存在（避免之後新增欄位定義造成缺漏）
    FIELD_DEFS.forEach(f=>{ if(!parsed[f.key]) parsed[f.key] = []; });
    return parsed;
  }catch(e){
    return structuredClone(DEFAULT_DATA);
  }
}

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// -------- 產生器區塊 --------
function renderFieldsGrid(){
  const grid = document.getElementById("fieldsGrid");
  grid.innerHTML = "";
  FIELD_DEFS.forEach(f=>{
    const wrap = document.createElement("div");
    wrap.className = "field";

    const label = document.createElement("label");
    label.textContent = f.label + (f.required ? "" : "（選填）");
    wrap.appendChild(label);

    const row = document.createElement("div");
    row.className = "field-row";

    const sel = document.createElement("select");
    sel.id = "select_" + f.key;
    sel.onchange = updateOutput;

    const showNone = !f.required || ["coating", "paintSystem", "strength"].includes(f.key);
    if(showNone){
      const optNone = document.createElement("option");
      optNone.value = "";
      optNone.textContent = "（不選用）";
      sel.appendChild(optNone);
    }

    (data[f.key]||[]).forEach(item=>{
      const opt = document.createElement("option");
      opt.value = item.code;
      opt.textContent = `${item.name}（${item.code}）`;
      sel.appendChild(opt);
    });
    row.appendChild(sel);

    const addBtn = document.createElement("button");
    addBtn.className = "icon-btn";
    addBtn.title = "新增" + f.label;
    addBtn.textContent = "+";
    addBtn.onclick = ()=>{ activeTab = f.key; renderManageTabs(); renderManageBody(); document.getElementById("manageBody").scrollIntoView({behavior:"smooth"}); };
    row.appendChild(addBtn);

    wrap.appendChild(row);
    grid.appendChild(wrap);
  });
  renderBackPaintSystemOptions();
  updateOutput();
}

function renderBackPaintSystemOptions(){
  const sel = document.getElementById("select_backPaintSystem");
  if(!sel) return;
  const current = sel.value;
  sel.innerHTML = "";

  const optNone = document.createElement("option");
  optNone.value = "";
  optNone.textContent = "（不選用）背面烤漆系統";
  sel.appendChild(optNone);

  (data.paintSystem || []).forEach(item=>{
    const opt = document.createElement("option");
    opt.value = item.code;
    opt.textContent = `${item.name}（${item.code}）`;
    sel.appendChild(opt);
  });

  if((data.paintSystem||[]).some(i=>i.code === current)) sel.value = current;
}

function getSelected(key){
  const sel = document.getElementById("select_" + key);
  const code = sel ? sel.value : "";
  if(!code) return { code: "", name: "" };
  const item = (data[key]||[]).find(i=>i.code === code);
  return { code, name: item ? item.name : "" };
}

function sanitizeThicknessInput(input){
  // 僅允許數字與一個小數點，過濾掉 e/+/- 等英文字元（number 輸入框的科學記號殘留問題）
  let v = input.value.replace(/[^0-9.]/g, "");
  const firstDot = v.indexOf(".");
  if(firstDot !== -1){
    v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, "");
  }
  input.value = v;
}

function toggleSpecialPaint(){
  const enabled = document.getElementById("specialPaintEnable").checked;
  document.getElementById("specialPaintInputs").style.display = enabled ? "block" : "none";
  if(!enabled){
    document.getElementById("specialPaintFront").value = "";
    document.getElementById("specialPaintBack").value = "";
    document.getElementById("select_backPaintSystem").value = "";
  }
  updateOutput();
}

function getSpecialPaint(frontPaintSystem){
  const enabled = document.getElementById("specialPaintEnable").checked;
  if(!enabled) return { code: "", name: "" };

  const front = document.getElementById("specialPaintFront").value.trim();
  const back  = document.getElementById("specialPaintBack").value.trim();

  const backSel = document.getElementById("select_backPaintSystem");
  const backCode = backSel.value;
  const backItem = (data.paintSystem || []).find(i=>i.code === backCode);
  const backName = backItem ? backItem.name : "";

  if(!front && !back && !backCode) return { code: "", name: "" };

  const hasBack = !!(backCode || back);

  // 例：正面 SMP45、背面 SMP45 -> 代碼顯示為 SMP45/SMP45
  const frontCodePart = `${frontPaintSystem.code || ""}${front || ""}`;
  const backCodePart  = `${backCode || ""}${back || ""}`;
  const code = hasBack ? `${frontCodePart}/${backCodePart}` : frontCodePart;

  const frontNamePart = `${frontPaintSystem.name || ""}${front || 0}um`;
  const backNamePart  = `${backName || ""}${back || 0}um`;
  const name = hasBack ? `${frontNamePart}/${backNamePart}` : frontNamePart;

  return { code, name };
}

function updateOutput(){
  const category    = getSelected("category");
  const material    = getSelected("material");
  const width       = getSelected("width");
  const thickness   = getSelected("thickness");
  const coating     = getSelected("coating");
  const brand       = getSelected("brand");
  const paintSystem = getSelected("paintSystem");
  const specialPaint= getSpecialPaint(paintSystem);
  const color       = getSelected("color");
  const strength    = getSelected("strength");

  const anySelected = [category, material, width, thickness, coating, brand, paintSystem, specialPaint, color, strength]
                        .some(f => f.code);

  let model = "－";
  if(anySelected){
    const paintSeg = specialPaint.code || paintSystem.code;
    const matWidth = [material.code, width.code].filter(seg => seg !== "").join("");
    const afterWidth = [thickness.code, coating.code, brand.code, paintSeg, color.code, strength.code]
                         .filter(seg => seg !== "")
                         .join("");
    const parts = [];
    if(category.code) parts.push(category.code);
    if(matWidth)      parts.push(matWidth);
    if(afterWidth)    parts.push(afterWidth);
    model = parts.length ? parts.join("-") : "－";
  }

  let productName = "－";
  if(anySelected){
    const part1 = width.code + "尺" + category.name;
    const part2 = thickness.name;
    const part3 = color.name + (specialPaint.name || paintSystem.name);
    const part4 = brand.name + coating.name;
    productName = [part1, part2, part3, part4].filter(p => p).join(" ");
  }

  // 銷貨品名：厚度的銷貨品名 + 空格 + 顏色名稱
  let salesName = "－";
  if(anySelected){
    const thkItem = (data.thickness || []).find(i => i.code === thickness.code);
    const thkSales = thkItem && thkItem.salesName ? thkItem.salesName : thickness.name;
    const colorName = color.name;
    const parts = [thkSales, colorName].filter(p => p);
    salesName = parts.length ? parts.join(" ") : "－";
  }

  document.getElementById("modelOutput").textContent = model;
  document.getElementById("nameOutput").textContent = productName;
  document.getElementById("salesNameOutput").textContent = salesName;

  const addBtn = document.getElementById("addToListBtn");
  if(addBtn) addBtn.disabled = (model === "－");
}

// -------- 產品種類清單 --------
const PRODUCT_LIST_KEY = "modelNameGenerator.productList.v1";
let productList = loadProductList();

function loadProductList(){
  try{
    const raw = localStorage.getItem(PRODUCT_LIST_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}

function saveProductList(){
  localStorage.setItem(PRODUCT_LIST_KEY, JSON.stringify(productList));
}

function addCurrentToList(){
  const model     = document.getElementById("modelOutput").textContent;
  const name      = document.getElementById("nameOutput").textContent;
  const salesName = document.getElementById("salesNameOutput").textContent;
  if(model === "－") return;
  productList.push({ model, name, salesName: salesName === "－" ? "" : salesName });
  saveProductList();
  renderProductList();
}

function renderProductList(){
  const tbody = document.getElementById("productListBody");
  tbody.innerHTML = "";

  if(productList.length === 0){
    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="4" class="empty-flag">尚未加入任何產品種類</td>`;
    tbody.appendChild(tr);
    return;
  }

  productList.forEach((item, idx)=>{
    const tr = document.createElement("tr");

    const mkInput = (val, onchange) => {
      const inp = document.createElement("input");
      inp.type = "text"; inp.value = val;
      inp.style.cssText = "width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 8px;";
      inp.oninput = onchange;
      return inp;
    };

    const tdModel = document.createElement("td");
    tdModel.appendChild(mkInput(item.model, e => { productList[idx].model = e.target.value; saveProductList(); }));

    const tdName = document.createElement("td");
    tdName.appendChild(mkInput(item.name, e => { productList[idx].name = e.target.value; saveProductList(); }));

    const tdSales = document.createElement("td");
    tdSales.appendChild(mkInput(item.salesName || "", e => { productList[idx].salesName = e.target.value; saveProductList(); }));

    const tdAction = document.createElement("td");
    tdAction.className = "actions";
    const delBtn = document.createElement("button");
    delBtn.className = "btn btn-danger";
    delBtn.textContent = "刪除";
    delBtn.onclick = ()=>{ productList.splice(idx, 1); saveProductList(); renderProductList(); };
    tdAction.appendChild(delBtn);

    tr.appendChild(tdModel); tr.appendChild(tdName); tr.appendChild(tdSales); tr.appendChild(tdAction);
    tbody.appendChild(tr);
  });
}

function clearProductList(){
  if(productList.length === 0) return;
  if(!confirm("確定要清空整個產品種類清單嗎？")) return;
  productList = [];
  saveProductList();
  renderProductList();
}

// -------- 純前端 XLSX 匯出（不依賴任何外部套件，以 ZIP store 方式打包） --------
function exportProductListToExcel(){
  if(productList.length === 0){ alert("清單目前是空的，請先加入產品種類。"); return; }

  const escXml = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  const rows = [["型號","品名","銷貨品名"], ...productList.map(p=>[p.model, p.name, p.salesName||""])];
  let sheetRows = "";
  rows.forEach((row, r)=>{
    const rn = r + 1;
    let cells = "";
    row.forEach((val, c)=>{
      const colLetter = String.fromCharCode(65 + c);
      cells += `<c r="${colLetter}${rn}" t="inlineStr"><is><t xml:space="preserve">${escXml(val)}</t></is></c>`;
    });
    sheetRows += `<row r="${rn}">${cells}</row>`;
  });

  const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<cols><col min="1" max="1" width="40" customWidth="1"/><col min="2" max="2" width="60" customWidth="1"/><col min="3" max="3" width="40" customWidth="1"/></cols>
<sheetData>${sheetRows}</sheetData>
</worksheet>`;

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
</Types>`;

  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;

  const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="產品種類清單" sheetId="1" r:id="rId1"/></sheets>
</workbook>`;

  const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
</Relationships>`;

  const files = [
    { name: "[Content_Types].xml", data: contentTypes },
    { name: "_rels/.rels", data: rootRels },
    { name: "xl/workbook.xml", data: workbookXml },
    { name: "xl/_rels/workbook.xml.rels", data: workbookRels },
    { name: "xl/worksheets/sheet1.xml", data: sheetXml },
  ];

  const blob = buildZip(files);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "產品種類清單.xlsx";
  a.click();
  URL.revokeObjectURL(url);
}

// ---- 最小可用 ZIP（store，不壓縮）打包器，純前端、零依賴 ----
let crcTable = null;
function crc32(bytes){
  if(!crcTable){
    crcTable = new Uint32Array(256);
    for(let n=0; n<256; n++){
      let c = n;
      for(let k=0; k<8; k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
      crcTable[n] = c;
    }
  }
  let crc = 0xFFFFFFFF;
  for(let i=0; i<bytes.length; i++){
    crc = crcTable[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function buildZip(files){
  const encoder = new TextEncoder();
  const fileChunks = [];
  const centralChunks = [];
  let offset = 0;

  files.forEach(f=>{
    const nameBytes = encoder.encode(f.name);
    const dataBytes = encoder.encode(f.data);
    const crc = crc32(dataBytes);

    const localHeader = new DataView(new ArrayBuffer(30));
    localHeader.setUint32(0, 0x04034b50, true);
    localHeader.setUint16(4, 20, true);
    localHeader.setUint16(6, 0, true);
    localHeader.setUint16(8, 0, true);
    localHeader.setUint16(10, 0, true);
    localHeader.setUint16(12, 0, true);
    localHeader.setUint32(14, crc, true);
    localHeader.setUint32(18, dataBytes.length, true);
    localHeader.setUint32(22, dataBytes.length, true);
    localHeader.setUint16(26, nameBytes.length, true);
    localHeader.setUint16(28, 0, true);

    fileChunks.push(new Uint8Array(localHeader.buffer), nameBytes, dataBytes);

    const centralHeader = new DataView(new ArrayBuffer(46));
    centralHeader.setUint32(0, 0x02014b50, true);
    centralHeader.setUint16(4, 20, true);
    centralHeader.setUint16(6, 20, true);
    centralHeader.setUint16(8, 0, true);
    centralHeader.setUint16(10, 0, true);
    centralHeader.setUint16(12, 0, true);
    centralHeader.setUint16(14, 0, true);
    centralHeader.setUint32(16, crc, true);
    centralHeader.setUint32(20, dataBytes.length, true);
    centralHeader.setUint32(24, dataBytes.length, true);
    centralHeader.setUint16(28, nameBytes.length, true);
    centralHeader.setUint16(30, 0, true);
    centralHeader.setUint16(32, 0, true);
    centralHeader.setUint16(34, 0, true);
    centralHeader.setUint16(36, 0, true);
    centralHeader.setUint32(38, 0, true);
    centralHeader.setUint32(42, offset, true);

    centralChunks.push(new Uint8Array(centralHeader.buffer), nameBytes);

    offset += 30 + nameBytes.length + dataBytes.length;
  });

  const centralStart = offset;
  let centralSize = 0;
  centralChunks.forEach(c => centralSize += c.length);

  const endRecord = new DataView(new ArrayBuffer(22));
  endRecord.setUint32(0, 0x06054b50, true);
  endRecord.setUint16(4, 0, true);
  endRecord.setUint16(6, 0, true);
  endRecord.setUint16(8, files.length, true);
  endRecord.setUint16(10, files.length, true);
  endRecord.setUint32(12, centralSize, true);
  endRecord.setUint32(16, centralStart, true);
  endRecord.setUint16(20, 0, true);

  const allChunks = [...fileChunks, ...centralChunks, new Uint8Array(endRecord.buffer)];
  return new Blob(allChunks, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

function copyText(elId){
  const text = document.getElementById(elId).textContent;
  if(text === "－") return;
  navigator.clipboard.writeText(text).catch(()=>{});
}

// -------- 欄位管理區塊 --------
function renderManageTabs(){
  const tabs = document.getElementById("manageTabs");
  tabs.innerHTML = "";
  FIELD_DEFS.forEach(f=>{
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (f.key === activeTab ? " active" : "");
    btn.textContent = f.label;
    btn.onclick = ()=>{ activeTab = f.key; renderManageTabs(); renderManageBody(); };
    tabs.appendChild(btn);
  });
}

function renderManageBody(){
  const body = document.getElementById("manageBody");
  const f = FIELD_DEFS.find(x=>x.key === activeTab);
  const list = data[activeTab] || [];

  body.innerHTML = "";

  const isColor = activeTab === "color";
  const colSpan = isColor ? 5 : 4;

  const table = document.createElement("table");
  const seriesHeader = isColor ? `<th style="width:90px;">系列代碼</th>` : "";
  table.innerHTML = `
    <thead>
      <tr><th style="width:120px;">代碼</th><th>名稱</th>${seriesHeader}<th>銷貨品名</th><th class="actions">操作</th></tr>
    </thead>
    <tbody id="tbody_${activeTab}"></tbody>
  `;
  body.appendChild(table);

  const tbody = table.querySelector("tbody");
  if(list.length === 0){
    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="${colSpan}" class="empty-flag">尚無內容，請於下方新增</td>`;
    tbody.appendChild(tr);
  }
  list.forEach((item, idx)=>{
    const tr = document.createElement("tr");
    const tdCode = document.createElement("td");
    tdCode.textContent = item.code;
    const tdName = document.createElement("td");
    tdName.textContent = item.name;

    const tdAction = document.createElement("td");
    tdAction.className = "actions";

    const mkMuted = (val) => {
      const td = document.createElement("td");
      td.textContent = val || "（未設定）";
      td.style.color = val ? "" : "#aaa";
      td.style.fontStyle = val ? "" : "italic";
      return td;
    };

    const editBtn = document.createElement("button");
    editBtn.className = "btn btn-ghost";
    editBtn.textContent = "編輯";
    editBtn.onclick = ()=> editItem(idx);

    const delBtn = document.createElement("button");
    delBtn.className = "btn btn-danger";
    delBtn.style.marginLeft = "6px";
    delBtn.textContent = "刪除";
    delBtn.onclick = ()=> deleteItem(idx);

    tdAction.appendChild(editBtn);
    tdAction.appendChild(delBtn);
    tr.appendChild(tdCode); tr.appendChild(tdName);
    if(isColor) tr.appendChild(mkMuted(item.seriesCode));
    tr.appendChild(mkMuted(item.salesName));
    tr.appendChild(tdAction);
    tbody.appendChild(tr);
  });

  const seriesInput = isColor
    ? `<input type="text" class="code" id="newSeriesCode_${activeTab}" placeholder="系列代碼（選填）">`
    : "";
  const addRow = document.createElement("div");
  addRow.className = "add-row";
  addRow.innerHTML = `
    <input type="text" class="code" id="newCode_${activeTab}" placeholder="新代碼，例如 GI">
    <input type="text" class="name" id="newName_${activeTab}" placeholder="新名稱，例如 鍍鋅">
    ${seriesInput}
    <input type="text" class="name" id="newSalesName_${activeTab}" placeholder="銷貨品名（選填）">
    <button class="btn btn-primary" id="addBtn_${activeTab}">新增 ${f.label}</button>
  `;
  body.appendChild(addRow);

  const errEl = document.createElement("div");
  errEl.className = "error";
  errEl.id = "err_" + activeTab;
  body.appendChild(errEl);

  document.getElementById(`addBtn_${activeTab}`).onclick = ()=> addItem();
}

function normalize(s){ return (s||"").trim(); }

function addItem(){
  const f = FIELD_DEFS.find(x=>x.key === activeTab);
  const codeInput = document.getElementById("newCode_" + activeTab);
  const nameInput = document.getElementById("newName_" + activeTab);
  const salesNameInput = document.getElementById("newSalesName_" + activeTab);
  const errEl = document.getElementById("err_" + activeTab);
  const code = normalize(codeInput.value);
  const name = normalize(nameInput.value);
  const salesName = normalize(salesNameInput.value);

  errEl.textContent = "";

  if(!code || !name){
    errEl.textContent = "請輸入代碼與名稱。";
    return;
  }

  const list = data[activeTab];
  const dupCode = list.some(i => i.code.toLowerCase() === code.toLowerCase());
  const dupName = list.some(i => i.name === name);
  if(dupCode){
    errEl.textContent = `代碼「${code}」已存在於「${f.label}」，請使用不同代碼。`;
    return;
  }
  if(dupName){
    errEl.textContent = `名稱「${name}」已存在於「${f.label}」，不可重複新增。`;
    return;
  }

  const seriesCodeInput = document.getElementById("newSeriesCode_" + activeTab);
  const seriesCode = seriesCodeInput ? normalize(seriesCodeInput.value) : "";
  const entry = {code, name};
  if(seriesCode) entry.seriesCode = seriesCode;
  if(salesName)  entry.salesName  = salesName;
  list.push(entry);
  saveData();
  codeInput.value = "";
  nameInput.value = "";
  salesNameInput.value = "";
  if(seriesCodeInput) seriesCodeInput.value = "";
  renderManageBody();
  renderFieldsGrid();
}

function editItem(idx){
  const f = FIELD_DEFS.find(x=>x.key === activeTab);
  const list = data[activeTab];
  const item = list[idx];
  const newCode = prompt(`修改「${f.label}」代碼：`, item.code);
  if(newCode === null) return;
  const newName = prompt(`修改「${f.label}」名稱：`, item.name);
  if(newName === null) return;
  let newSeriesCode = null;
  if(activeTab === "color"){
    newSeriesCode = prompt(`修改顏色「系列代碼」（選填，留空表示不設定）：`, item.seriesCode || "");
    if(newSeriesCode === null) return;
  }
  const newSalesName = prompt(`修改「${f.label}」銷貨品名（選填，留空表示不設定）：`, item.salesName || "");
  if(newSalesName === null) return;

  const code = normalize(newCode);
  const name = normalize(newName);
  const salesName = normalize(newSalesName);
  const seriesCode = newSeriesCode !== null ? normalize(newSeriesCode) : (item.seriesCode || "");
  if(!code || !name){ alert("代碼與名稱不可為空。"); return; }

  const dup = list.some((i, i2)=> i2 !== idx && (i.code.toLowerCase() === code.toLowerCase() || i.name === name));
  if(dup){ alert("代碼或名稱與其他項目重複，請修改後再試。"); return; }

  const entry = {code, name};
  if(seriesCode) entry.seriesCode = seriesCode;
  if(salesName)  entry.salesName  = salesName;
  list[idx] = entry;
  saveData();
  renderManageBody();
  renderFieldsGrid();
}

function deleteItem(idx){
  const f = FIELD_DEFS.find(x=>x.key === activeTab);
  const item = data[activeTab][idx];
  if(!confirm(`確定要刪除「${f.label}」中的「${item.name}（${item.code}）」嗎？`)) return;
  data[activeTab].splice(idx, 1);
  saveData();
  renderManageBody();
  renderFieldsGrid();
}

// -------- 備份 / 還原 --------
function exportData(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "model-name-generator-data.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      FIELD_DEFS.forEach(f=>{ if(!parsed[f.key]) parsed[f.key] = []; });
      data = parsed;
      saveData();
      renderFieldsGrid();
      renderManageTabs();
      renderManageBody();
      alert("匯入成功！");
    }catch(err){
      alert("匯入失敗，請確認檔案格式是否正確。");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

function resetData(){
  if(!confirm("確定要還原為預設值嗎？此操作會覆蓋目前所有自訂內容。")) return;
  data = structuredClone(DEFAULT_DATA);
  saveData();
  renderFieldsGrid();
  renderManageTabs();
  renderManageBody();
}

// -------- 初始化 --------
renderFieldsGrid();
renderManageTabs();
renderManageBody();
renderProductList();
</script>
